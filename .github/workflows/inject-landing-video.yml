name: Integrate The Signals landing video

on:
  push:
    paths:
      - '.github/workflows/inject-landing-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-landing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add video section and sync price
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          css = r'''
          <style id="signals-video-styles">
            .video-proof{
              position:relative;
              overflow:hidden;
              padding:clamp(72px,9vw,120px) 0;
              background:
                radial-gradient(circle at 77% 35%, rgba(164,31,37,.18), transparent 34%),
                radial-gradient(circle at 18% 80%, rgba(140,23,29,.10), transparent 32%),
                #0b0b0d;
              color:#f4efe8;
              border-top:1px solid rgba(255,255,255,.06);
              border-bottom:1px solid rgba(255,255,255,.06);
            }
            .video-proof::before{
              content:"";
              position:absolute;
              inset:0;
              pointer-events:none;
              background:linear-gradient(120deg,transparent 0 48%,rgba(255,255,255,.025) 49%,transparent 50% 100%);
            }
            .video-proof-grid{
              position:relative;
              z-index:1;
              display:grid;
              grid-template-columns:minmax(0,1fr) minmax(280px,420px);
              gap:clamp(42px,7vw,96px);
              align-items:center;
            }
            .video-proof-copy{max-width:680px}
            .video-proof .video-kicker{
              display:inline-flex;
              align-items:center;
              gap:10px;
              margin-bottom:18px;
              color:#d54b50;
              font-size:12px;
              font-weight:800;
              letter-spacing:.18em;
              text-transform:uppercase;
            }
            .video-proof .video-kicker::before{
              content:"";
              width:34px;
              height:1px;
              background:#c5363c;
            }
            .video-proof h2{
              margin:0 0 22px;
              max-width:720px;
              color:#f8f2e9;
              font-size:clamp(42px,5.4vw,76px);
              line-height:.98;
              letter-spacing:-.04em;
            }
            .video-proof .video-lead{
              max-width:620px;
              margin:0 0 28px;
              color:rgba(244,239,232,.76);
              font-size:clamp(18px,2vw,22px);
              line-height:1.55;
            }
            .video-proof .video-lead strong{color:#fff;font-weight:700}
            .video-proof-signals{
              display:flex;
              flex-wrap:wrap;
              gap:10px;
              margin:0 0 32px;
            }
            .video-proof-signals span{
              padding:9px 13px;
              border:1px solid rgba(213,75,80,.32);
              border-radius:999px;
              background:rgba(255,255,255,.025);
              color:rgba(244,239,232,.78);
              font-size:13px;
              letter-spacing:.035em;
            }
            .video-proof .video-subline{
              display:block;
              margin-top:12px;
              color:rgba(244,239,232,.48);
              font-size:12px;
              line-height:1.5;
            }
            .video-proof-player{
              width:100%;
              max-width:390px;
              justify-self:end;
            }
            .video-frame{
              position:relative;
              padding:8px;
              border:1px solid rgba(213,75,80,.36);
              border-radius:28px;
              background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.015));
              box-shadow:0 30px 80px rgba(0,0,0,.48),0 0 60px rgba(171,32,38,.12);
            }
            .video-frame::after{
              content:"";
              position:absolute;
              inset:8px;
              z-index:2;
              pointer-events:none;
              border-radius:21px;
              box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
            }
            .video-frame video{
              display:block;
              width:100%;
              aspect-ratio:9/16;
              border-radius:21px;
              background:#000;
              object-fit:cover;
            }
            .video-caption{
              margin:15px 0 0;
              text-align:center;
              color:rgba(244,239,232,.62);
              font-family:Georgia,serif;
              font-size:14px;
              font-style:italic;
              letter-spacing:.04em;
            }
            @media (max-width:820px){
              .video-proof{padding:64px 0 72px}
              .video-proof-grid{grid-template-columns:1fr;gap:38px}
              .video-proof-copy{text-align:center;margin-inline:auto}
              .video-proof h2{margin-inline:auto;font-size:clamp(40px,11vw,62px)}
              .video-proof .video-lead{margin-inline:auto}
              .video-proof .video-kicker{justify-content:center}
              .video-proof-signals{justify-content:center}
              .video-proof-player{justify-self:center;max-width:min(82vw,370px)}
              .video-proof .btn{width:min(100%,420px)}
            }
          </style>
          '''

          block = r'''
          <section id="video-the-signals" class="video-proof" aria-labelledby="video-signals-title">
            <div class="wrap video-proof-grid">
              <div class="video-proof-copy">
                <span class="video-kicker">16 segundos · una idea clave</span>
                <h2 id="video-signals-title">Antes de interpretar otra señal, mirá esto.</h2>
                <p class="video-lead">Una conducta aislada puede parecer una respuesta. <strong>The Signals</strong> te enseña a mirar contexto, repetición y patrón antes de sacar conclusiones.</p>
                <div class="video-proof-signals" aria-label="Conceptos clave">
                  <span>Hechos ≠ historias</span>
                  <span>Contexto</span>
                  <span>Repetición</span>
                  <span>Patrón</span>
                </div>
                <a class="btn js-buy" href="#">QUIERO THE SIGNALS <small>US$ 16,99</small></a>
                <span class="video-subline">Acceso digital inmediato · Compra segura por Hotmart</span>
              </div>

              <div class="video-proof-player">
                <div class="video-frame">
                  <video controls playsinline preload="metadata" poster="assets/the-signals-video-poster.webp" aria-label="Video de presentación de The Signals">
                    <source src="assets/the-signals-landing-1080.mp4" type="video/mp4">
                    Tu navegador no puede reproducir este video.
                  </video>
                </div>
                <p class="video-caption">No leas mentes. Lee patrones.</p>
              </div>
            </div>
          </section>
          '''

          changed = False

          if 'id="signals-video-styles"' not in html:
              if '</head>' not in html:
                  raise SystemExit('No se encontró </head> en index.html')
              html = html.replace('</head>', css + '\n</head>', 1)
              changed = True

          if 'id="video-the-signals"' not in html:
              anchor = '  </header>\n\n  <section class="section light">'
              if anchor in html:
                  html = html.replace(anchor, '  </header>\n\n' + block + '\n\n  <section class="section light">', 1)
              elif '</header>' in html:
                  html = html.replace('</header>', '</header>\n\n' + block, 1)
              else:
                  raise SystemExit('No se encontró </header> en index.html')
              changed = True

          old = html
          html = html.replace('US$ 22,22', 'US$ 16,99')
          if html != old:
              changed = True

          if changed:
              path.write_text(html, encoding='utf-8')
              print('Landing actualizada.')
          else:
              print('No había cambios pendientes.')
          PY

      - name: Commit landing update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add landing video section and update price"
          git push
