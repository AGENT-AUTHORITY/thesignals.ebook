name: Install Google Tag Manager

on:
  push:
    paths:
      - '.github/workflows/install-gtm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-gtm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject GTM into landing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          gtm_head = r'''<!-- Google Tag Manager -->
          <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
          new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
          'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
          })(window,document,'script','dataLayer','GTM-5Z55N97S');</script>
          <!-- End Google Tag Manager -->'''

          gtm_body = r'''<!-- Google Tag Manager (noscript) -->
          <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5Z55N97S"
          height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
          <!-- End Google Tag Manager (noscript) -->'''

          changed = False

          if '<!-- Google Tag Manager -->' not in html:
              if '<head>' not in html:
                  raise SystemExit('No se encontró <head> en index.html')
              html = html.replace('<head>', '<head>\n  ' + gtm_head.replace('\n', '\n  '), 1)
              changed = True

          if '<!-- Google Tag Manager (noscript) -->' not in html:
              match = re.search(r'<body(?:\s[^>]*)?>', html, flags=re.I)
              if not match:
                  raise SystemExit('No se encontró <body> en index.html')
              body_tag = match.group(0)
              html = html[:match.end()] + '\n  ' + gtm_body.replace('\n', '\n  ') + html[match.end():]
              changed = True

          if changed:
              path.write_text(html, encoding='utf-8')
              print('GTM-5Z55N97S instalado en index.html')
          else:
              print('GTM ya estaba instalado; no se hicieron cambios.')
          PY

      - name: Commit GTM installation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Install Google Tag Manager"
          git push
